<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08050c">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Code Edge</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #08050c; }
    iframe { display: block; border: 0; }
    .fallback { position: fixed; inset: auto 16px 16px; z-index: 1; color: #fff; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <iframe
    src="https://bloibloi.github.io/Code-edge/"
    title="Code Edge"
    allow="autoplay; fullscreen; clipboard-read; clipboard-write; display-capture"
    allowfullscreen>
  </iframe>
  <noscript><a class="fallback" href="https://bloibloi.github.io/Code-edge/">Open Code Edge</a></noscript>
</body>
</html>
